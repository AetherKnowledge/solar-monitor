; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = firmware/src
include_dir = firmware/include
lib_dir = firmware/lib
data_dir = firmware/data
default_envs = esp32-s3-devkitc1-n16r8

[env]
platform = https://github.com/pioarduino/platform-espressif32.git
framework = arduino
board_build.filesystem = littlefs

build_flags = 
    -std=gnu++23
    -Wl,--no-warn-rwx-segments
    -fdiagnostics-color=always
    -Wno-attributes
    -D PSYCHIC_WS_MAX_FRAME_SIZE=2048
    -D PSYCHIC_WS_RX_STATIC_BUFFER
build_unflags = 
    -std=gnu++11
    -std=gnu++17

extra_scripts = 
    pre:scripts/generate_version.py
    pre:scripts/generate_compiledb.py
    pre:scripts/copy_public_key.py
    pre:scripts/generate_secret_header.py
    scripts/upload_file.py
monitor_speed = 115200
monitor_filters = default, log2file, esp32_exception_decoder

lib_deps =
  hoeken/PsychicHttp
  bblanchon/ArduinoJson @ ^7.4.3
  knolleary/PubSubClient @ ^2.8
  4-20ma/ModbusMaster @ ^2.0.1
  olikraus/U8g2

platform_packages = 
    platformio/tool-mklittlefs

[env:esp32dev]
board = esp32dev
board_build.partitions = firmware/partitions.csv

monitor_port = COM4
upload_port = COM4

[env:esp32-s3-devkitc1-n16r8]
board = esp32-s3-devkitc1-n16r8
board_build.partitions = firmware/partitions-s3.csv

build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_port = COM6
upload_port = COM6